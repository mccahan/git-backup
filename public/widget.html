<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Git Backup Widget</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: transparent; color: #e6edf3; padding: 10px 14px; font-size: 13px; line-height: 1.4; }
  .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .label { color: #8b949e; }
  .value { font-weight: 500; text-align: right; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle;
    transition: background-color 0.3s ease; }
  .dot-ok { background: #3fb950; }
  .dot-err { background: #f85149; }
  .dot-idle { background: #8b949e; }
  .dot-running { background: #d29922; animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  .msg { color: #8b949e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  a { color: #58a6ff; text-decoration: none; }
</style>
</head>
<body>
<div class="row">
  <span class="label">Mappings</span>
  <span class="value" id="wMappings">—</span>
</div>
<div class="row">
  <span class="label">Last Backup</span>
  <span class="value" id="wLastBackup">—</span>
</div>
<div class="row">
  <span class="label">Status</span>
  <span class="value" id="wStatus"><span class="dot dot-idle" id="wDot"></span><span id="wStatusText">idle</span></span>
</div>
<div class="msg" id="wMsg">—</div>

<script>
const BASE_PATH = window.location.pathname.replace(/\/widget\.html$/, '').replace(/\/+$/, '');

// Track current state to avoid unnecessary DOM updates
let currentState = {
  mappings: null,
  lastBackup: null,
  status: null,
  statusText: null,
  msg: null,
  msgUrl: null
};

function relTime(iso) {
  if (!iso) return 'never';
  const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
}

function escHtml(s) {
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}

function updateDOM(newState) {
  // Only update elements that actually changed
  if (newState.mappings !== currentState.mappings) {
    document.getElementById('wMappings').textContent = newState.mappings;
    currentState.mappings = newState.mappings;
  }
  
  if (newState.lastBackup !== currentState.lastBackup) {
    document.getElementById('wLastBackup').textContent = newState.lastBackup;
    currentState.lastBackup = newState.lastBackup;
  }
  
  // Update status dot and text separately to avoid full innerHTML replacement
  const dot = document.getElementById('wDot');
  const statusText = document.getElementById('wStatusText');
  
  if (newState.status !== currentState.status) {
    dot.className = 'dot dot-' + newState.status;
    currentState.status = newState.status;
  }
  
  if (newState.statusText !== currentState.statusText) {
    statusText.textContent = newState.statusText;
    currentState.statusText = newState.statusText;
  }
  
  // Update message - compare both content and URL
  if (newState.msg !== currentState.msg || newState.msgUrl !== currentState.msgUrl) {
    const msgEl = document.getElementById('wMsg');
    if (newState.msgUrl) {
      msgEl.innerHTML = '<a href="' + escHtml(newState.msgUrl) + '" target="_blank">' + escHtml(newState.msg) + '</a>';
    } else {
      msgEl.textContent = newState.msg;
    }
    currentState.msg = newState.msg;
    currentState.msgUrl = newState.msgUrl;
  }
}

const CACHE_KEY = 'gitBackupWidget';

function saveCache(state) {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(state)); } catch (e) {}
}

function restoreCache() {
  try {
    const cached = JSON.parse(localStorage.getItem(CACHE_KEY));
    if (cached) updateDOM(cached);
  } catch (e) {}
}

let loadInProgress = false;

async function load() {
  // Prevent overlapping requests
  if (loadInProgress) return;
  loadInProgress = true;
  
  try {
    const [mappings, status, history] = await Promise.all([
      fetch(BASE_PATH + '/api/mappings').then(r => r.json()),
      fetch(BASE_PATH + '/api/status').then(r => r.json()),
      fetch(BASE_PATH + '/api/history?limit=1').then(r => r.json()),
    ]);

    const latest = history[0];
    
    let statusClass, statusTextVal;
    if (status.backupInProgress) {
      statusClass = 'running';
      statusTextVal = 'running';
    } else if (latest && latest.error) {
      statusClass = 'err';
      statusTextVal = 'error';
    } else {
      statusClass = 'ok';
      statusTextVal = 'ok';
    }
    
    let msg = '—';
    let msgUrl = null;
    if (latest && latest.commitMessage) {
      msg = latest.commitMessage.length > 60
        ? latest.commitMessage.substring(0, 57) + '…'
        : latest.commitMessage;
      msgUrl = latest.commitUrl || null;
    }

    const newState = {
      mappings: String(mappings.length),
      lastBackup: latest ? relTime(latest.timestamp) : 'never',
      status: statusClass,
      statusText: statusTextVal,
      msg: msg,
      msgUrl: msgUrl
    };

    updateDOM(newState);
    saveCache(newState);
  } catch (e) {
    updateDOM({
      ...currentState,
      status: 'err',
      statusText: 'error',
      msg: e.message,
      msgUrl: null
    });
  } finally {
    loadInProgress = false;
  }
}

restoreCache();
load();
setInterval(load, 60000);
</script>
</body>
</html>
